<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvell Digital Appliance — Chairman's Digital Card</title>
<meta name="description" content="Official digital visiting card — Marvell Digital Appliance">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@600;700;800&family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!--
  ============================================================
  HOW TO EDIT THIS CARD (read me first)
  ============================================================
  1. COLORS      -> edit the :root CSS variables below (search "EDIT COLORS")
  2. LOGO        -> replace the <div class="logo-mark"> SVG monogram with
                     an <img src="logo.png"> tag (search "EDIT LOGO")
  3. PHOTO       -> replace the placeholder silhouette in .photo-frame
                     with <img src="chairman.jpg"> (search "EDIT PHOTO")
  4. NAME/TITLE  -> search "EDIT NAME"
  5. CONTACT     -> search "EDIT CONTACT" (phone, email, address, website)
  6. SOCIAL      -> search "EDIT SOCIAL" (Facebook, WhatsApp links)
  Everything is self-contained in this one file. No build step, no server.
  Just upload index.html (and your logo/photo images) anywhere.
  ============================================================
-->

<style>
  /* ============ EDIT COLORS ============ */
  :root{
    --void: #050507;
    --panel: #09090b;
    --panel-2: #0f0f12;
    --red: #e01e2b;
    --red-bright: #ff3b3f;
    --white: #f5f3f0;
    --steel: #9a9aa0;
    --steel-dim: #6b6b70;
    --hairline: rgba(245,243,240,0.07);
    --glow: rgba(224,30,43,0.35);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    min-height:100%;
    background:var(--void);
  }

  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient backdrop */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 50% 0%, var(--glow), transparent 55%),
      repeating-linear-gradient(0deg, rgba(245,243,240,0.018) 0px, rgba(245,243,240,0.018) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(245,243,240,0.018) 0px, rgba(245,243,240,0.018) 1px, transparent 1px, transparent 42px);
    pointer-events:none;
    z-index:0;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    background:linear-gradient(165deg, rgba(15,15,18,0.98) 0%, rgba(7,7,9,0.99) 35%, rgba(4,4,6,0.99) 70%, rgba(10,10,13,0.98) 100%);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:24px;
    padding:44px 40px 32px;
    box-shadow:
      0 35px 90px -20px rgba(0,0,0,0.95),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    animation:cardIn 0.7s cubic-bezier(.19,1,.22,1) both;
  }

  /* Deep breathing ambient edge glow behind the card */
  .card::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:26px;
    background:linear-gradient(
      135deg,
      rgba(255, 59, 63, 0.45) 0%,
      rgba(224, 30, 43, 0.25) 20%,
      transparent 40%,
      transparent 60%,
      rgba(224, 30, 43, 0.25) 80%,
      rgba(255, 59, 63, 0.5) 100%
    );
    z-index:-1;
    filter:blur(14px);
    opacity:0.75;
    animation:edgePulse 4s ease-in-out infinite alternate;
    pointer-events:none;
  }

  /* Sharp illuminated glass border rim */
  .card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:25px;
    padding:1.5px;
    background:linear-gradient(
      140deg,
      rgba(255, 255, 255, 0.35) 0%,
      rgba(255, 59, 63, 0.6) 20%,
      rgba(245, 243, 240, 0.03) 45%,
      rgba(245, 243, 240, 0.03) 60%,
      rgba(224, 30, 43, 0.65) 80%,
      rgba(255, 255, 255, 0.2) 100%
    );
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    z-index:2;
  }

  @keyframes edgePulse{
    0%{
      opacity:0.55;
      filter:blur(12px);
      transform:scale(0.995);
    }
    100%{
      opacity:0.95;
      filter:blur(18px);
      transform:scale(1.01);
    }
  }

  @keyframes cardIn{
    from{ opacity:0; transform:translateY(18px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- eyebrow / wordmark row ---------- */
  .eyebrow{
    display:flex;
    align-items:center;
    gap:11px;
    justify-content:center;
    margin-bottom:34px;
  }

  .logo-mark{
    width:160px;
    height:auto;
    display:block;
    margin:0 auto;
    filter:drop-shadow(0 4px 14px rgba(224,30,43,0.22));
    transition:transform 0.3s ease, filter 0.3s ease;
  }
  .logo-mark:hover{
    transform:scale(1.03);
    filter:drop-shadow(0 6px 20px rgba(224,30,43,0.4));
  }

  .eyebrow-text{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--steel);
  }

  /* ---------- photo frame with corner brackets ---------- */
  .photo-wrap{
    position:relative;
    width:150px;
    height:150px;
    margin:0 auto 26px;
  }

  .photo-frame{
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #151518, #040406 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1px solid var(--hairline);
  }

  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 20%;
    display:block;
  }
  .photo-frame svg{ width:56%; height:56%; opacity:0.35; }

  .bracket{
    position:absolute;
    width:18px; height:18px;
    border:2px solid var(--red);
    opacity:0.9;
  }
  .bracket.tl{ top:-4px; left:-4px; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .bracket.tr{ top:-4px; right:-4px; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .bracket.bl{ bottom:-4px; left:-4px; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .bracket.br{ bottom:-4px; right:-4px; border-left:none; border-top:none; border-radius:0 0 6px 0; }

  .status-dot{
    position:absolute;
    top:2px; right:2px;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--red-bright);
    border:2.5px solid var(--panel);
    box-shadow:0 0 10px 2px var(--glow);
    animation:pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ box-shadow:0 0 8px 1px var(--glow); }
    50%{ box-shadow:0 0 14px 4px var(--glow); }
  }

  /* ---------- name / title ---------- */
  .identity{ text-align:center; margin-bottom:26px; }

  /* EDIT NAME: chairman's full name */
  .name{
    font-family:'Outfit', 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight:800;
    font-style:normal;
    font-size:30px;
    letter-spacing:-0.02em;
    line-height:1.15;
    margin-bottom:8px;
    background:linear-gradient(100deg, var(--white) 30%, #e2dfd9 60%, var(--white) 85%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* EDIT NAME: title + company */
  .title-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    color:var(--red-bright);
    text-transform:uppercase;
  }

  .company-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--steel-dim);
    margin-top:5px;
  }

  .circuit-rule{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--hairline) 15%, var(--hairline) 85%, transparent);
    margin:22px 0;
    position:relative;
  }
  .circuit-rule::before{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:5px; height:5px;
    background:var(--red);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }

  /* ---------- contact rows with Liquid Glassmorphism ---------- */
  .contact-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:26px; }

  .contact-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 15px;
    border-radius:15px;
    text-decoration:none;
    color:inherit;
    background:linear-gradient(135deg, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0.015) 100%);
    border:1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:
      0 6px 20px -6px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -1px 0 rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
    transition:transform 0.25s cubic-bezier(.2,.8,.2,1),
               background 0.25s ease,
               border-color 0.25s ease,
               box-shadow 0.25s ease;
  }

  /* Liquid sheen sweep animation */
  .contact-row::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
    transform:skewX(-20deg);
    transition:left 0.6s ease;
    pointer-events:none;
  }

  .contact-row:hover{
    background:linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
    border-color:rgba(224, 30, 43, 0.35);
    transform:translateY(-2px) scale(1.008);
    box-shadow:
      0 12px 28px -8px rgba(0,0,0,0.5),
      0 0 20px -5px rgba(224,30,43,0.25),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .contact-row:hover::before{
    left:140%;
  }

  .contact-row:active{
    transform:scale(0.985);
    background:rgba(224,30,43,0.08);
    border-color:var(--red);
  }

  .contact-icon{
    width:40px; height:40px;
    border-radius:11px;
    background:linear-gradient(135deg, rgba(224, 30, 43, 0.12), rgba(0, 0, 0, 0.4));
    border:1px solid rgba(224, 30, 43, 0.25);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow:0 0 12px -2px rgba(224,30,43,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
    transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .contact-row:hover .contact-icon{
    transform:scale(1.06);
    border-color:var(--red-bright);
    box-shadow:0 0 18px 2px rgba(224,30,43,0.35);
  }

  .contact-icon svg{ width:17px; height:17px; stroke:var(--red-bright); fill:none; }

  .contact-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .contact-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--steel-dim);
  }
  .contact-value{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:14.5px;
    color:var(--white);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---------- action buttons ---------- */
  .actions{ margin-bottom:8px; }

  .btn-row{ display:flex; gap:12px; }

  .btn-call{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:9px;
    background:linear-gradient(135deg, var(--red-bright), var(--red));
    color:var(--white);
    border:1px solid transparent;
    border-radius:14px;
    padding:15px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    cursor:pointer;
    letter-spacing:0.01em;
    box-shadow:0 14px 30px -12px var(--glow);
    transition:filter 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-call:hover{
    filter:brightness(1.08);
    transform:translateY(-2px);
    box-shadow:0 18px 36px -12px var(--glow);
  }
  .btn-call:active{
    transform:scale(0.98);
  }
  .btn-call svg{ width:17px; height:17px; stroke:var(--white); fill:none; }

  .btn-whatsapp{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 100%);
    color:var(--white);
    border:1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:14px;
    padding:15px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:
      0 6px 20px -6px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.09);
    transition:border-color 0.25s ease, background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .btn-whatsapp:hover{
    border-color:rgba(224, 30, 43, 0.45);
    background:linear-gradient(135deg, rgba(224, 30, 43, 0.15) 0%, rgba(224, 30, 43, 0.05) 100%);
    transform:translateY(-2px);
    box-shadow:0 12px 28px -8px rgba(0,0,0,0.5), 0 0 20px -5px rgba(224,30,43,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-whatsapp:active{
    transform:scale(0.98);
  }
  .btn-whatsapp svg{ width:17px; height:17px; stroke:var(--red-bright); fill:none; }

  @media (min-width:640px){
    .card{ max-width:480px; padding:48px 44px 34px; }
    .name{ font-size:34px; }
  }

  @media (max-width:360px){
    .card{ padding:28px 20px 22px; }
    .photo-wrap{ width:112px; height:112px; }
    .name{ font-size:22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
    .card::after{ animation:none; }
    .status-dot{ animation:none; }
  }
</style>
</head>
<body>

<div class="card">

  <!-- eyebrow -->
  <div class="eyebrow">
    <!-- EDIT LOGO: transparent high-res Marvell Digital logo -->
    <img class="logo-mark" src="marvell-logo.png" alt="Marvell Digital">
  </div>

  <!-- photo -->
  <div class="photo-wrap">
    <div class="photo-frame">
      <img src="pfp.jpg" alt="Ahidur Rahman">
    </div>
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>
    <div class="status-dot"></div>
  </div>

  <!-- identity -->
  <div class="identity">
    <!-- EDIT NAME -->
    <div class="name">Ahidur Rahman</div>
    <div class="title-line">Chairman</div>
    <div class="company-line">Marvell Digital Appliance</div>
  </div>

  <div class="circuit-rule"></div>

  <!-- contact -->
  <div class="contact-list">

    <!-- EDIT CONTACT: phone -->
    <a class="contact-row" href="tel:+8801716445445">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <div class="contact-text">
        <div class="contact-label">Phone</div>
        <div class="contact-value">+880 1716-445445</div>
      </div>
    </a>

    <!-- EDIT CONTACT: website -->
    <a class="contact-row" href="https://marvelldigital.com.bd/" target="_blank" rel="noopener">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <div class="contact-text">
        <div class="contact-label">Website</div>
        <div class="contact-value">marvelldigital.com.bd</div>
      </div>
    </a>

    <!-- EDIT CONTACT: email -->
    <a class="contact-row" href="mailto:marvelldigitalbd@gmail.com">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      </div>
      <div class="contact-text">
        <div class="contact-label">Email</div>
        <div class="contact-value">marvelldigitalbd@gmail.com</div>
      </div>
    </a>

    <!-- EDIT CONTACT: address -->
    <a class="contact-row" href="https://www.google.com/maps/search/?api=1&query=71+Motijheel+C%2FA%2C+Dhaka%2C+Bangladesh%2C+1000" target="_blank" rel="noopener">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div class="contact-text">
        <div class="contact-label">Office</div>
        <div class="contact-value">71 Motijheel C/A, Dhaka 1000</div>
      </div>
    </a>

  </div>

  <!-- actions -->
  <div class="actions">
    <div class="btn-row">
      <!-- EDIT CONTACT: call button number -->
      <a class="btn-call" href="tel:+8801716445445">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call
      </a>
      <!-- EDIT SOCIAL: whatsapp number, digits only with country code -->
      <a class="btn-whatsapp" href="https://wa.me/8801716445445" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.36 7.56L3 20l1.06-5.44A8.5 8.5 0 1 1 21 11.5z"/></svg>
        WhatsApp
      </a>
    </div>
  </div>

</div>

</body>
